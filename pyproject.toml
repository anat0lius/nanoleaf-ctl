[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nanoleaf-omarchy"
version = "1.0.0"
description = "Nanoleaf Blocks / Panels control, screen mirroring and theme sync for Omarchy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
nanoleaf-ctl = "nanoleaf_omarchy.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/nanoleaf_omarchy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
